# =============================================================================
# fix-prose 辞書ファイル
#
# コードコメント / ドキュメントの「直したい語彙・言い回し」を宣言する。
# scan.py がこのファイルを読み、対象ファイルから該当箇所を検出する。
# 実際の書き換えは Claude が SKILL.md の手順に従って行う。
#
# 言語ごと (en / ja) × ティアごと (always / contextual / density) に定義する。
#   - always     : 文脈不問で直す（出たら必ず指摘）
#   - contextual : 文脈次第。技術的に正当な用法は許容（allow_in で制御）
#   - density    : 単独では正当。多用 / 共起したときだけ指摘
#
# 「随時ワードを追加する」場合は、該当セクションに 1 行足すだけでよい。
# 末尾の「追加方法」も参照。
# =============================================================================

[meta]
# active profile に応じて contextual 語の許容範囲が変わる（--profile で指定）。
# technical = コード/技術文書向け（contextual 語に寛容）
# docs      = 一般ドキュメント向け
# strict    = 厳格（contextual もすべて指摘）
default_profile = "technical"


# =============================================================================
# English
# =============================================================================

# --- always: 文脈不問で直す（AI らしさの強いマーカー） -----------------------
# 形式:  "base" = ["置換候補1", "置換候補2", ...]
# 活用形（-s/-ed/-ing 等）は scan.py が自動で拾う。
[en.always]
DDB = ["DynamoDB"]
delve = ["look into", "go into", "examine"]
embark = ["start", "begin"]
"shed light on" = ["clarify", "explain"]
"pave the way" = ["enable", "lead to"]
"dive into" = ["look at", "go into"]
underscore = ["highlight", "show"]
bolster = ["strengthen", "support"]
testament = ["sign", "proof"]
"game-changer" = ["major change", "big shift"]
tapestry = ["mix", "range"]
realm = ["area", "field"]
"first and foremost" = ["first"]
ratchet = ["step up", "creep up", "climb without dropping back"]
"fail fast" = ["すぐに失敗させる", "即時失敗", "fail quickly"]
stale = ["古い", "陳腐化した", "期限切れの"]
staleness = ["古さ", "鮮度劣化", "陳腐化"]
ESM = ["Event Source Mapping"]
pinning = ["接続固定", "セッション固定", "固定"]
seed = ["投入", "種データ投入", "事前投入"]
shape = ["クラス", "型", "形状"]
"built distribution" = ["ビルド済み wheel", "ビルド済みパッケージ"]
"wall-clock" = ["実行時間", "実経過時間", "実時間"]

# --- contextual: 技術文脈では許容。それ以外では直す --------------------------
# 形式:  base = { suggest = [...], allow_in = ["technical", ...], note = "..." }
# allow_in に active profile が含まれれば「許容（info 扱い）」、含まれなければ指摘。
[en.contextual]
robust = { suggest = ["reliable", "solid", "stable"], allow_in = ["technical"], note = "システム/型の頑健性など技術的意味なら許容" }
comprehensive = { suggest = ["complete", "full", "thorough"], allow_in = ["technical"], note = "網羅性を実際に指す場合は許容" }
seamless = { suggest = ["smooth", "direct"], allow_in = ["technical"], note = "空虚な賛辞なら直す" }
leverage = { suggest = ["use", "apply"], allow_in = ["technical"], note = "実際の API/プラットフォーム活用の意味なら許容" }
facilitate = { suggest = ["help", "ease"], allow_in = ["technical"], note = "" }
streamline = { suggest = ["simplify", "speed up"], allow_in = ["technical"], note = "" }
ecosystem = { suggest = ["set of tools", "stack"], allow_in = ["technical"], note = "" }
utilize = { suggest = ["use"], allow_in = [], note = "ほぼ常に use で足りる" }

# --- density: 多用 / 共起したときだけ指摘 ------------------------------------
# threshold = 散文中の総語数に対する density 語の合計割合（これを超えたら指摘）
# 同一段落に 2 語以上同居した場合も指摘対象にする。
[en.density]
threshold = 0.03
words = [
  "comprehensive",
  "seamless",
  "robust",
  "leverage",
  "facilitate",
  "intricate",
  "nuanced",
  "holistic",
  "vibrant",
]

# --- pattern: 構造・ジャーゴンの正規表現。検出のみ、書き換えは note に従う ---
# 日本語に埋め込まれた英単語は単語境界が効かないため、語ではなく regex で捕まえる。
[en.pattern]
in_flight = { regex = '(?i)in[-\s]?flight', suggest = ["処理が完了する前にメッセージが再配信される", "処理の完了前に再配信される"], note = "ジャーゴン。『in-flight 再配信』等は『処理が完了する前にメッセージが再配信される』のように平易な日本語へ言い換える。文に馴染む形を選ぶ。コード識別子や API 名の一部なら残す" }
phantom_dependency = { regex = '(?i)phantom[-\s]?dep[a-z]*', suggest = ["package.json に宣言されていない依存", "宣言されていない依存"], note = "ジャーゴン。『package.json に宣言されていない依存に依存している』のように開いて説明する" }
hoist = { regex = '(?i)hoist[a-z]*', suggest = ["最上位にまとめて展開する", "node_modules の最上位に巻き上げる"], note = "依存の hoisting を指す場合は『依存を node_modules の最上位にまとめて展開する』のように開く。物を持ち上げる一般的な意味なら残す" }
graceful_shutdown = { regex = '(?i)graceful[-\s]?shut\s?down', suggest = ["正常終了", "正常停止", "正常なシャットダウン"], note = "ジャーゴン。プロセスが終了時に接続をクローズする挙動を指す場合は『正常終了』『正常停止』へ言い換える。日本語に埋め込まれた英語表記を平易にする" }
two_phase = { regex = '(?i)two[-\s]?phase', suggest = ["2段階初期化", "初期化を2段階に分ける"], note = "ジャーゴン。__init__ で空値を置き後続処理で実値を設定する初期化は『2段階の初期化』のように開いて説明する。コード識別子や型名の一部なら残す" }
narrowing = { regex = '(?i)narrowing', suggest = ["型の絞り込み", "None でないことの保証"], note = "型チェッカー向けの type narrowing を指す場合は『型の絞り込み』や『None でないことを保証する処理』のように開く。一般的な絞り込みの意味なら残す" }
best_effort = { regex = '(?i)best[-\s]?effort', suggest = ["可能な範囲で", "失敗しても処理を止めずに"], note = "ジャーゴン。失敗を許容する試行を指す。『中断は best-effort』→『中断は可能な範囲での試み』、『best-effort で捕捉』→『失敗しても処理を止めずに捕捉』のように開く。SLA 等の正式用語として使う場合は残す" }
per_prefix = { regex = '(?i)\bper-[a-z]+', suggest = ["〜ごと", "〜単位"], note = "接頭辞ジャーゴン。処理・設定を対象ごとに分ける『per-X』表現は『X ごと』『X 単位』へ開く（『per-app』→『アプリ単位』、『per-IP』→『IP ごと』、『per-entry』→『エントリ単位』）。CLI フラグ・設定キー・API 名の一部なら残す" }
single_user = { regex = '(?i)single[-\s]?user', suggest = ["単一ユーザー", "利用者が自分だけ"], note = "利用者が一人だけの環境を指すなら『単一ユーザー』『利用者が自分だけ』へ開く。ロール名や識別子の一部なら残す" }
bare_emf = { regex = '(?<!CloudWatch )\bEMF\b', suggest = ["CloudWatch EMF"], note = "AWS 公式略語だが単独では文脈が伝わらないため『CloudWatch EMF』と表記する。既に CloudWatch EMF の形なら regex が除外するので検出されない。ライブラリ名・設定キー（aws-embedded-metrics 等）の一部なら残す" }


# =============================================================================
# Japanese
# =============================================================================
# 日本語は語境界が曖昧なため部分一致で判定する。
# キー先頭の "〜" はワイルドカード（直前の文を表す表示用記号）として扱い、
# マッチ時には "〜" を除いた残りを部分一致検索する。

# --- always: 文脈不問で直す --------------------------------------------------
[ja.always]
"DDB" = ["DynamoDB"]
"a11y" = ["アクセシビリティ"]
"導出" = ["組み立てる", "求める", "算出する"]
"させていただく" = ["する", "します"]
"ご確認のほど、よろしくお願いいたします" = ["ご確認をお願いします"]
